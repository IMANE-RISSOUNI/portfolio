name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Query profile
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Configure SUPABASE_URL and SUPABASE_ANON_KEY in Actions secrets."
            exit 1
          fi
          if ! status=$(curl --silent --max-time 15 --output /dev/null --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/profile?select=id&limit=1"); then
            echo "Supabase keep-alive request failed."
            exit 1
          fi
          echo "Supabase returned HTTP $status"
          [[ "$status" == 2[0-9][0-9] ]]
